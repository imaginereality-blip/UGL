<?xml version="1.0" encoding="UTF-8"?>
    <svg width="460" height="260" viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg">

      <!-- ══ MAIN RAIL BODY ══ -->
      <g id="body">
        <path d="
          M 118,96 L 366,96
          Q 378,96 380,108
          L 382,124
          Q 383,134 373,136
          L 118,136
          Q 108,136 108,126
          L 108,106
          Q 108,96 118,96 Z"
          fill="#232019" stroke="#4a4038" stroke-width="2.5"/>
      </g>

      <!-- ══ STICK — on the back, just above the handle ══ -->
      <g id="stick">
        <circle cx="143" cy="78" r="17" fill="#2b2621" stroke="#4a4038" stroke-width="2"/>
        <circle cx="143" cy="78" r="9" fill="#3a332c" stroke="#221d19" stroke-width="1.5"/>
      </g>

      <!-- Raised rear sight, shifted clear of the new stick -->
      <g id="rear-sight">
        <rect x="195" y="70" width="46" height="26" rx="4" fill="#2b2621" stroke="#4a4038" stroke-width="2"/>
        <rect x="205" y="64" width="10" height="10" rx="2" fill="#3a332c"/>
        <rect x="227" y="64" width="10" height="10" rx="2" fill="#3a332c"/>
      </g>

      <!-- Rail grooves — reduced, forward of the sight -->
      <g id="rail-grooves" fill="#3a332c">
        <rect x="280" y="88" width="10" height="10" rx="1.5"/>
        <rect x="296" y="88" width="10" height="10" rx="1.5"/>
        <rect x="312" y="88" width="10" height="10" rx="1.5"/>
      </g>

      <!-- Muzzle / front block -->
      <g id="muzzle">
        <rect x="370" y="100" width="30" height="30" rx="4" fill="#2b2621" stroke="#4a4038" stroke-width="2"/>
        <rect x="398" y="110" width="10" height="10" fill="#3a332c"/>
      </g>

      <!-- Status indicator lights — matches the 3-dot row on the real product -->
      <g id="indicator-lights">
        <circle cx="300" cy="118" r="6" fill="#c9a250"/>
        <circle cx="322" cy="118" r="6" fill="#c9a250"/>
        <circle cx="344" cy="118" r="6" fill="#c9a250"/>
      </g>

      <!-- ══ GRIP — blocky, mostly-vertical, flared magazine-style base ══ -->
      <g id="grip">
        <path d="
          M 122,140 L 172,140
          L 176,222
          Q 176,232 166,234
          L 128,234
          Q 118,232 118,222
          Z"
          fill="#232019" stroke="#4a4038" stroke-width="2.5"/>
      </g>
      <g id="grip-base">
        <rect x="112" y="228" width="72" height="16" rx="4" fill="#3a332c" stroke="#2b2621" stroke-width="1.5"/>
      </g>

      <!-- ══ TRIGGER ══ -->
      <g id="trigger-guard">
        <path d="M 178,140 Q 200,140 202,158 Q 204,176 186,180" fill="none" stroke="#4a4038" stroke-width="3"/>
      </g>
      <g id="trigger">
        <rect x="182" y="146" width="13" height="26" rx="5" fill="#c9a250" stroke="#8a6c2e" stroke-width="1.5"/>
      </g>

      <!-- ══ A (near flank) / B (far flank) — utility buttons on the grip, one
           per side of the body. Only the near flank is drawable in a single side
           profile; B stands in for the mirrored far-side button. ══ -->
      <g id="button-a-front">
        <circle cx="98" cy="118" r="13" fill="#5fbb46" stroke="#0e2e06" stroke-width="1.5"/>
        <text x="98" y="123" font-size="11" font-weight="700" fill="#0e2e06" text-anchor="middle">A</text>
      </g>
      <g id="button-b-side">
        <circle cx="98" cy="150" r="13" fill="#e5493d" stroke="#4a0e08" stroke-width="1.5"/>
        <text x="98" y="155" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
      </g>

      <!-- ══ MENU CLUSTER — Back / Guide / Start, top of the forward rail ══ -->
      <g id="button-back">
        <rect x="250" y="76" width="28" height="15" rx="4" fill="#5a5049" stroke="#3a332c" stroke-width="1.25"/>
        <text x="264" y="87" font-size="7" fill="#1e1a16" text-anchor="middle" font-weight="700">BACK</text>
      </g>
      <g id="button-guide">
        <circle cx="302" cy="83" r="13" fill="#3a332c" stroke="#4a4038" stroke-width="1.5"/>
        <path d="M296,79 L308,79 L305,88 L299,88 Z" fill="#c9a250" opacity="0.85"/>
      </g>
      <g id="button-start">
        <rect x="330" y="76" width="28" height="15" rx="4" fill="#5a5049" stroke="#3a332c" stroke-width="1.25"/>
        <text x="344" y="87" font-size="6.5" fill="#1e1a16" text-anchor="middle" font-weight="700">START</text>
      </g>

      <!-- ══ D-PAD — left flank, toward the FRONT of the barrel (not the rear
           top) — below the rail, ahead of the indicator lights ══ -->
      <g id="dpad-up">
        <rect x="294" y="150" width="16" height="18" rx="3" fill="#5a5049" stroke="#3a332c" stroke-width="1.25"/>
      </g>
      <g id="dpad-down">
        <rect x="294" y="178" width="16" height="18" rx="3" fill="#5a5049" stroke="#3a332c" stroke-width="1.25"/>
      </g>
      <g id="dpad-left">
        <rect x="276" y="166" width="18" height="16" rx="3" fill="#5a5049" stroke="#3a332c" stroke-width="1.25"/>
      </g>
      <g id="dpad-right">
        <rect x="312" y="166" width="18" height="16" rx="3" fill="#5a5049" stroke="#3a332c" stroke-width="1.25"/>
      </g>
      <rect x="294" y="166" width="16" height="16" fill="#443c34"/>

    </svg>
